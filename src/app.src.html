<title>Radiant Lighting Invoicing</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400;0,700;1,400&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: slim dark-green command bar, then a working surface; editor = form column + live A4 paper preview */
:root{
  --bg:#f2f4ef; --surface:#ffffff; --sunk:#e9ede5; --ink:#1f2933; --muted:#667066; --line:#dce2d7;
  --accent:#6d9f53; --accent-ink:#4c7a37; --on-accent:#ffffff; --deep:#2b3a2f; --on-deep:#eef3ea;
  --danger:#b4432f; --danger-bg:#fbeae6; --focus:#6d9f53;
  --ui:"Figtree", "Segoe UI", system-ui, sans-serif;
  --doc:"Arimo", Arial, "Helvetica Neue", Helvetica, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111612; --surface:#192019; --sunk:#141a15; --ink:#e4eae1; --muted:#98a396; --line:#2b352c;
  --accent:#84b768; --accent-ink:#9fcb86; --on-accent:#0f160f; --deep:#0b100c; --on-deep:#e4eae1;
  --danger:#ee8a75; --danger-bg:#3a1f19; --focus:#9fcb86; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111612; --surface:#192019; --sunk:#141a15; --ink:#e4eae1; --muted:#98a396; --line:#2b352c;
  --accent:#84b768; --accent-ink:#9fcb86; --on-accent:#0f160f; --deep:#0b100c; --on-deep:#e4eae1;
  --danger:#ee8a75; --danger-bg:#3a1f19; --focus:#9fcb86; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--deep)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--deep);color:var(--on-deep);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.brand svg{width:26px;height:28px}
.brand small{display:block;font-weight:500;font-size:11px;opacity:.7;letter-spacing:.06em;text-transform:uppercase}
nav{display:flex;gap:4px;overflow-x:auto;min-width:0;flex:1}
nav button{background:none;border:0;color:var(--on-deep);opacity:.72;padding:7px 12px;border-radius:6px;cursor:pointer;white-space:nowrap;font-weight:500}
nav button:hover{opacity:1;background:rgba(255,255,255,.07)}
nav button[aria-current="true"]{opacity:1;background:rgba(132,183,104,.22);color:#fff}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px;max-width:1440px;margin:0 auto}
.banner{background:var(--sunk);border:1px solid var(--line);color:var(--muted);padding:10px 14px;border-radius:8px;margin-bottom:16px;font-size:13px}
h1{font-size:22px;margin:0;text-wrap:balance;font-weight:700}
h2{font-size:15px;margin:0 0 10px;font-weight:700}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink)}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:7px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.ghost{background:none;border-color:transparent;color:var(--accent-ink);padding-inline:8px}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger-bg);border-color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:8px 10px;width:100%;min-width:0;font-size:14px;color:var(--ink)}
textarea{resize:vertical;min-height:70px;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stack{display:flex;flex-direction:column;gap:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;cursor:pointer;font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--deep);color:var(--on-deep);border-color:var(--deep)}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;padding:2px 7px;border-radius:4px;text-transform:uppercase}
.tag.QT{background:color-mix(in srgb,#d9a13b 18%,transparent);color:#a26e10}
.tag.INV{background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent-ink)}
.tag.DN{background:color-mix(in srgb,#4f86b8 18%,transparent);color:#3a6f9e}
.tag.PO{background:color-mix(in srgb,#8a63b8 18%,transparent);color:#6a4596}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag.QT{color:#e6b65c}:root:not([data-theme="light"]) .tag.DN{color:#86b4dc}}
:root[data-theme="dark"] .tag.QT{color:#e6b65c}:root[data-theme="dark"] .tag.DN{color:#86b4dc}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--deep);color:var(--on-deep);padding:10px 16px;border-radius:8px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
/* documents list */
.doclist{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.drow{display:grid;grid-template-columns:170px 70px minmax(0,1fr) 100px 120px auto;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.drow:first-child{border-top:0}
.drow.head{background:var(--sunk);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.drow .num{font-weight:700;cursor:pointer;color:var(--ink);background:none;border:0;padding:0;text-align:left}
.drow .num:hover{color:var(--accent-ink);text-decoration:underline}
.drow .cust{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow .amt{text-align:right;font-weight:600}
.drow .acts{display:flex;gap:4px;justify-content:flex-end;flex-wrap:wrap}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
@media (max-width:820px){
  .drow{grid-template-columns:minmax(0,1fr) auto;gap:4px 10px}
  .drow.head{display:none}
  .drow .d-type{grid-row:1;grid-column:2;justify-self:end}
  .drow .num{grid-row:1;grid-column:1}
  .drow .cust{grid-column:1/-1}
  .drow .d-date{grid-column:1}
  .drow .amt{grid-column:2}
  .drow .acts{grid-column:1/-1;justify-content:flex-start}
}
/* editor */
.editor{display:grid;grid-template-columns:minmax(0,460px) minmax(0,1fr);gap:20px;align-items:start}
.pv-col{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);min-width:0}
.pv-wrap{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:14px;overflow:hidden}
.pv-scale{transform-origin:0 0;box-shadow:0 2px 14px rgba(20,30,20,.14)}
.ai{background:color-mix(in srgb,var(--accent) 9%,var(--surface));border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.item{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.item-top{display:flex;gap:8px;align-items:center}
.item-top .idx{font-weight:700;color:var(--muted);width:18px;font-variant-numeric:tabular-nums}
.item-top select{flex:1}
.thumb{width:42px;height:42px;border-radius:6px;border:1px solid var(--line);object-fit:contain;background:#fff;flex:none}
.item .amtline{font-size:13px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.item .amtline b{color:var(--ink)}
.totals{font-variant-numeric:tabular-nums;display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-size:14px}
.totals .gt{font-weight:700;font-size:16px;color:var(--accent-ink)}
.mobtabs{display:none}
@media (max-width:980px){
  .editor{grid-template-columns:minmax(0,1fr)}
  .pv-col{position:static}
  .mobtabs{display:flex;gap:6px;margin-bottom:12px}
  .editor[data-pane="form"] .pv-col{display:none}
  .editor[data-pane="preview"] .form-col{display:none}
}
@media (max-width:480px){ .g3{grid-template-columns:1fr 1fr} .g2.keep{grid-template-columns:1fr 1fr} .g2:not(.keep){grid-template-columns:1fr} }
.cmdlog{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:13px}
.cmdlog li{padding-left:20px;position:relative;line-height:1.4}
.cmdlog li::before{position:absolute;left:0;top:0;font-weight:700}
.cmdlog .ok::before{content:"✓";color:var(--accent-ink)}
.cmdlog .ask::before{content:"?";color:#b7791f}
.cmdhelp{font-size:12.5px;line-height:1.7;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:8px}
.cmdhelp b{color:var(--ink)}
.slashtog{display:flex;gap:10px;align-items:flex-start;font-size:13px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.slashtog input{width:auto;margin-top:3px}.slashtog:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.totals .saveline{color:var(--accent-ink);font-weight:600}
.vpick{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
select.need{border-color:#d9a13b;background:color-mix(in srgb,#d9a13b 8%,var(--surface))}
.vsect{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.vsect h3{font-size:14px;margin:0}.vsect .hint{font-size:12px}
.vrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.2fr) auto;gap:6px;align-items:center}
.vrow .vspec{grid-column:1/-1;margin-bottom:4px}
.orow{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.6fr) minmax(0,1.1fr) auto;gap:6px;align-items:center}
@media (max-width:520px){.orow{grid-template-columns:minmax(0,1fr) auto}.orow input:nth-child(2),.orow input:nth-child(3){grid-column:1/-1}.orow button{grid-row:1;grid-column:2}}
.vchips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}.vchips span{font-size:11px;font-weight:700;border:1px solid var(--line);border-radius:99px;padding:1px 7px;color:var(--muted)}
.pcard .sp i{font-style:normal;opacity:.75}
.pnav{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.pnav input{max-width:420px}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:13px}
.crumb{background:none;border:0;padding:4px 6px;border-radius:6px;cursor:pointer;color:var(--accent-ink);font-weight:600}
.crumb:hover{background:var(--sunk)}.crumb.on{color:var(--ink);cursor:default}.crumbs .sep{color:var(--muted)}
.ftiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.ftile{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;font:inherit;color:inherit}
.ftile:hover{border-color:var(--accent)}
.fpics{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;aspect-ratio:3/1;max-width:100%;background:var(--sunk);border-radius:7px;overflow:hidden}
.fpics img{width:100%;height:100%;object-fit:contain;background:#fff}
.fnone{grid-column:1/-1;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:var(--muted)}
.fname{font-weight:700}.fsub{font-size:12px;color:var(--muted)}
@media (max-width:760px){.ftiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mline{margin-right:auto;font-size:12px;color:var(--muted)}.mline .neg,.mpanel .neg{color:var(--danger);font-weight:700}
.item .amtline{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;justify-content:flex-end}
.mpanel{border:1px dashed var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--sunk);font-size:13px}
.mpanel:empty{display:none}.mhead{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.mhead .muted{font-size:12px}
.mgrid{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-variant-numeric:tabular-nums}.mgrid .pos{color:var(--accent-ink)}
.mwarn{color:var(--danger);font-weight:600;font-size:12px}
.cmargin{font-size:11.5px;font-weight:600;color:var(--accent-ink)}
.vrow{grid-template-columns:minmax(0,.9fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1.2fr) auto!important}
@media (max-width:520px){.vrow{grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) auto!important}.vrow input[data-vf$=".model"]{grid-column:1/3;grid-row:2}.vrow .vspec{grid-column:3/-1!important;grid-row:2}}
/* orders */
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:6px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.jobs{display:flex;flex-direction:column;gap:10px}
.job{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.job-hd{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.job-who{font-weight:700;font-size:15px}
.job-sub{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.job-rt{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.job-val{font-variant-numeric:tabular-nums}
.job-ft{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px}
.done-mark{font-weight:700;color:var(--accent-ink);font-size:13px}
.pill{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:99px}
.pill.QT{background:color-mix(in srgb,#d9a13b 18%,transparent);color:#a26e10}
.pill.INV{background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent-ink)}
.pill.DN{background:color-mix(in srgb,#4f86b8 18%,transparent);color:#3a6f9e}
.pill.done{background:var(--deep);color:var(--on-deep)}
.steps{display:flex;align-items:center;min-width:0}
.step{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;text-align:left;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--sunk);font:inherit;color:inherit}
.step .lb{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.step .no{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums}
button.step{cursor:pointer}
.step.done{border-color:color-mix(in srgb,var(--accent) 55%,var(--line));background:color-mix(in srgb,var(--accent) 9%,var(--surface))}
.step.done .lb{color:var(--accent-ink)}
.step.done:hover{border-color:var(--accent)}
.step.cur{box-shadow:0 0 0 2px var(--accent)}
.step.todo{border-style:dashed;background:none}.step.todo .no{color:var(--muted);font-weight:500}
.step.skip{opacity:.55;background:none}.step.skip .no{font-weight:500}
.sbar{width:14px;height:2px;background:var(--line);flex:none}.sbar.on{background:var(--accent)}
.ed-steps{margin-bottom:14px}
@media (max-width:520px){.step{padding:6px 7px}.step .lb{font-size:9.5px;letter-spacing:.03em}.step .no{font-size:12px}.sbar{width:6px}}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill.QT{color:#e6b65c}:root:not([data-theme="light"]) .pill.DN{color:#86b4dc}}
:root[data-theme="dark"] .pill.QT{color:#e6b65c}:root[data-theme="dark"] .pill.DN{color:#86b4dc}
/* catalogue */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.pcard .ph{aspect-ratio:1/1;max-width:100%;background:#fff;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line)}
.pcard .ph img{width:100%;height:100%;object-fit:contain}
.pcard .ph span{color:#9aa39a;font-size:12px}
.pcard .bd{padding:12px;display:flex;flex-direction:column;gap:4px;flex:1}
.pcard .nm{font-weight:700;line-height:1.3}
.pcard .sp{font-size:12px;color:var(--muted)}
.pcard .sp.wr{color:var(--accent-ink);font-weight:600}
.pcard .pr{font-weight:700;font-variant-numeric:tabular-nums;margin-top:auto;padding-top:6px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,400px);gap:20px;align-items:start}
@media (max-width:900px){.two{grid-template-columns:minmax(0,1fr)} .two .formside{order:-1}}
.clist{display:flex;flex-direction:column;gap:8px}
.crow{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.crow .cn{font-weight:700}
.photo-pick{display:flex;gap:12px;align-items:center}
.photo-pick img{width:72px;height:72px;border-radius:8px;border:1px solid var(--line);object-fit:contain;background:#fff}
.photo-pick .ph0{width:72px;height:72px;border-radius:8px;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);text-align:center}
.sect{display:flex;flex-direction:column;gap:10px}
.sect + .sect{border-top:1px solid var(--line);padding-top:14px;margin-top:4px}
.logo-drop{display:flex;flex-direction:column;align-items:center;gap:10px;border:1.5px dashed var(--line);border-radius:10px;padding:18px 12px;cursor:pointer;text-align:center;background:var(--sunk)}
.logo-drop:hover,.logo-drop.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--sunk))}
.logo-paper{background:#ffffff;border-radius:6px;padding:12px 16px;box-shadow:0 1px 4px rgba(20,30,20,.12);display:flex}
.logo-paper img{width:225px;height:101px;object-fit:contain;max-width:100%}
.logo-cta{font-size:13px;color:var(--muted)}.logo-cta b{color:var(--ink)}
.logo-info{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.logo-info .q{font-weight:700;padding:2px 8px;border-radius:99px;font-size:12px}
.q.good{background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent-ink)}
.q.ok{background:color-mix(in srgb,#d9a13b 20%,transparent);color:#a26e10}
.q.low{background:var(--danger-bg);color:var(--danger)}
.tips{margin:0;padding-left:18px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
#pdfStage{position:fixed;left:-10000px;top:0;width:794px;pointer-events:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== printed paper (always white, matches Canva templates; colors fixed by design) ===== */
.paper{width:794px;min-height:1123px;background:#ffffff;color:#1f2933;font-family:var(--doc);position:relative;display:flex;flex-direction:column;padding:0 48px;font-variant-numeric:tabular-nums;line-height:1.4;font-size:9px;text-align:left}
.paper *{box-sizing:border-box}

.p-rule{height:2px;background:#6d9f53}
.p-info{display:flex;gap:12px;margin-top:10px}

.p-cn{font-size:12px;font-weight:700;margin-top:4.6px;line-height:1.4;color:#1f2933}
.p-cd{font-size:9px;color:#4b5563;line-height:1.55;margin-top:6.4px;white-space:pre-line}
.p-meta{display:grid;grid-template-columns:110px 1fr;font-size:9px;line-height:1.75}

.p-sum{display:flex;justify-content:space-between;margin-top:14px}

<script>
"use strict";
const LOGO="__LOGO__";
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmt=n=>Math.round(Number(n)||0).toLocaleString("en-US");
const fdate=iso=>{if(!iso)return"";const[y,m,d]=iso.split("-");return `${+d} ${MON[+m-1]} ${y}`};
const todayISO=()=>{const t=new Date();t.setMinutes(t.getMinutes()-t.getTimezoneOffset());return t.toISOString().slice(0,10)};
const addDays=(iso,n)=>{const t=new Date(iso+"T12:00:00");t.setDate(t.getDate()+n);return t.toISOString().slice(0,10)};
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const TYPE_NAME={QT:"Quotation",INV:"Invoice",DN:"Delivery note",PO:"Purchase order"};
const PO_STATUS=[["draft","Draft"],["negotiating","Negotiating"],["ordered","Ordered"],["received","Received"]];
const poStatusName=k=>(PO_STATUS.find(x=>x[0]===k)||PO_STATUS[0])[1];
const clone=o=>JSON.parse(JSON.stringify(o));

const DEFAULTS={
  company:"Radiant Lighting",tagline:"Elevating Spaces Through Light",
  address:"Office 6, 2nd Floor, Crystal Arcade, LMQ Road, Multan",
  phone:"+92 340 4705718",email:"info@radiantlighting.pk",website:"www.radiantlighting.pk",
  ntn:"",strn:"",
  bankTitle:"Radiant Lighting",bankName:"",bankAcc:"",iban:"",
  signName:"",signTitle:"Authorised Signatory",
  gstRate:18,defaultTax:"excl",quoteValidDays:7,
  termsQT:"Prices ex-Multan.\nPayment: 100% advance.\nDelivery within 1-2 days of payment.\nWarranty as stated against each item.",
  termsINV:"Prices ex-Multan.\nPayment: 100% advance.\nDelivery within 1-2 days of payment.\nWarranty as stated against each item.",
  notesDefault:"Prices are exclusive of GST.",
  termsPO:"Please confirm prices and delivery date on receipt of this order.\nGoods must match the description and specification above.\nDeliver with a delivery challan quoting this PO number.\nPayment as agreed.",
  dnInstructions:"Please check quantity and condition before signing.\nNote any shortage or damage on this delivery note.\nClaims must be reported within 24 hours of delivery.\nSignature confirms goods received in good order.",
  logo:""
};

const S={settings:{...DEFAULTS},products:[],customers:[],suppliers:[],sform:null,cmode:"customers",docs:[],view:"docs",mode:"orders",jfilter:"open",filter:"all",q:"",
  ed:null,pane:"form",pform:null,cform:null,armed:null,ready:{settings:false,products:false,customers:false,suppliers:false,docs:false}};
let DB=null,ASSETS=null,SAMPLE=null,DL=null;

/* ---------- money & words (all arithmetic here, never from AI) ---------- */
const ONES=["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"];
const TENS=["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
function w999(n){let s="";if(n>=100){s+=ONES[Math.floor(n/100)]+" Hundred";n%=100;if(n)s+=" "}
  if(n>=20){s+=TENS[Math.floor(n/10)];if(n%10)s+="-"+ONES[n%10]}else if(n>0)s+=ONES[n];return s}
function inWords(n){n=Math.round(Math.abs(Number(n)||0));if(!n)return"Zero Rupees Only";const p=[];
  for(const[v,l]of[[1e9,"Billion"],[1e6,"Million"],[1e3,"Thousand"]]){if(n>=v){p.push(w999(Math.floor(n/v))+" "+l);n%=v}}
  if(n)p.push(w999(n));return p.join(" ")+" Rupees Only"}
const num=v=>{const n=parseFloat(String(v).replace(/,/g,""));return Number.isFinite(n)?n:0};
function lineAmt(it){return Math.round(num(it.qty)*num(it.rate))}
/* a line shows its own photo, or the product's current photo (so photos added later appear on old quotes) */
const lineImg=it=>{const v=it.img||(it.pid&&S.products.find(p=>p.id===it.pid)?.img)||"";return typeof imgSrc==="function"?imgSrc(v):v};
const slashOn=d=>!!d.slash&&d.type!=="DN"&&d.type!=="PO";
const isSlashed=(d,it)=>slashOn(d)&&num(it.list)>num(it.rate);
function calc(d){
  const sub=d.items.reduce((a,it)=>a+lineAmt(it),0);
  const dv=num(d.discount?.v);const disc=Math.min(sub,Math.round(d.discount?.t==="pct"?sub*dv/100:dv));
  const rate=num(d.gstRate);const tax=d.taxMode==="add"?Math.round((sub-disc)*rate/100):0;
  const slashSave=slashOn(d)?d.items.reduce((a,it)=>a+(isSlashed(d,it)?(num(it.list)-num(it.rate))*num(it.qty):0),0):0;
  return{sub,disc,tax,grand:sub-disc+tax,qty:d.items.reduce((a,it)=>a+num(d.type==="DN"?it.qtyDel:it.qty),0),save:slashOn(d)?Math.round(slashSave+disc):0};
}

/* ---------- printed document ---------- */
/* warranty prints only when it is 1 year or more (or lifetime); shorter, "no warranty" or unclear text stays off the document */
function warrantyYears(w){w=String(w||"").toLowerCase();if(!w.trim()||/\b(no|none|nil)\b/.test(w))return 0;if(/lifetime/.test(w))return 99;
  const y=w.match(/(\d+(?:\.\d+)?)\s*(?:-|\s)?(?:years?|yrs?|y)\b/);if(y)return +y[1];const m=w.match(/(\d+)\s*(?:-|\s)?(?:months?|mos?|m)\b/);if(m)return m[1]/12;
  const wd={one:1,two:2,three:3,four:4,five:5,ten:10}[(w.match(/\b(one|two|three|four|five|ten)\s+years?\b/)||[])[1]];return wd||0}
const warrantyText=w=>{w=String(w||"").trim();if(warrantyYears(w)<1)return"";return /warrant|guarantee/i.test(w)?w:"Warranty: "+w};
const showsWarranty=d=>d.items.some(it=>warrantyText(it.warranty));
/* drop the generic "as stated against each item" terms line when no item carries a printed warranty */
const docTerms=(d,txt)=>showsWarranty(d)?txt:lines(txt).filter(l=>!/against each item/i.test(l)).join("\n");
function lines(txt){return String(txt||"").split("\n").map(s=>s.trim()).filter(Boolean)}
function numbered(txt){return lines(txt).map((l,i)=>`${i+1}. ${l.replace(/^\d+[.)]\s*/,"")}`).join("\n")}
/* the party box: customer (bill to / deliver to) or, on a purchase order, the supplier */
const partyLabel=d=>d.type==="PO"?"SUPPLIER":d.type==="DN"?"DELIVER TO":"BILL TO";
function partyLines(d){const c=d.customer||{};
  return[c.attn?("Attn: "+c.attn+(c.phone?"  ·  "+c.phone:"")):c.phone,d.type==="PO"?c.email:"",c.address,c.ntn&&((d.type==="PO"?"NTN: ":"Customer NTN: ")+c.ntn)].filter(Boolean).join("\n")}
const poDeliverTo=()=>{const s=S.settings;return[s.company,s.address,[s.phone&&("Tel: "+s.phone),s.email].filter(Boolean).join("  ·  ")].filter(Boolean).join("\n")};
function docHTML(d){
  const s=S.settings,t=calc(d),dn=d.type==="DN",im=!!d.showImages,c=d.customer||{};
  const title={QT:"QUOTATION",INV:"INVOICE",DN:"DELIVERY NOTE",PO:"PURCHASE ORDER"}[d.type];
  const sub={QT:"CUSTOMER COPY",INV:"ORIGINAL  ·  CUSTOMER COPY",DN:"CUSTOMER COPY",PO:"SUPPLIER COPY"}[d.type];
  const taxIds=[s.ntn&&("NTN: "+s.ntn),s.strn&&("STRN: "+s.strn)].filter(Boolean).join("  ·  ");
  const addr=[s.address,[s.phone&&("Tel: "+s.phone),s.email].filter(Boolean).join("  ·  "),s.website,taxIds].filter(Boolean).join("\n");
  const cdet=partyLines(d);
  const no=d.number||`RL-${d.type}-${(d.date||todayISO()).slice(0,4)}-····`;
  let meta=[];
  if(d.type==="QT")meta=[["Quotation No.",no],["Quotation Date",fdate(d.date)],["Valid Until",fdate(d.validUntil)]];
  if(d.type==="INV"){meta=[["Invoice No.",no],["Invoice Date",fdate(d.date)]];if(d.dueDate)meta.push(["Due Date",fdate(d.dueDate)]);if(d.refQT)meta.push(["Quotation Ref.",d.refQT])}
  if(dn){meta=[["DN No.",no],["Delivery Date",fdate(d.date)]];if(d.refINV)meta.push(["Invoice Ref.",d.refINV])}
  if(d.type==="PO"){meta=[["PO No.",no],["PO Date",fdate(d.date)]];if(d.dueDate)meta.push(["Required By",fdate(d.dueDate)])}
  const cols=dn?(im?"36px 56px 278px 114px 96px 118px":"36px 334px 114px 96px 118px"):(im?"36px 56px 278px 54px 56px 106px 112px":"36px 334px 54px 56px 106px 112px");
  const head=dn
    ?`<div class="p-c0">#</div>${im?'<div class="p-ctr">ITEM</div>':""}<div class="p-dsc">DESCRIPTION</div><div class="p-ctr">UNIT</div><div class="p-ctr">QTY ORDERED</div><div class="p-ctr">QTY DELIVERED</div>`
    :`<div class="p-c0">#</div>${im?'<div class="p-ctr">ITEM</div>':""}<div class="p-dsc">DESCRIPTION</div><div class="p-ctr">QTY</div><div class="p-ctr">UNIT</div><div class="p-rt">RATE (PKR)</div><div class="p-am">AMOUNT (PKR)</div>`;
  const rows=d.items.length?d.items.map((it,i)=>{
    const li=lineImg(it),img=im?`<div>${li?`<img class="p-img" src="${esc(li)}" alt="">`:'<div class="p-noimg"></div>'}</div>`:"";
    const desc=`<div class="p-dsc"><div class="p-nm">${esc(it.name||"—")}</div>${it.spec?`<div class="p-sp">${esc(it.spec)}</div>`:""}${warrantyText(it.warranty)?`<div class="p-wr">${esc(warrantyText(it.warranty))}</div>`:""}</div>`;
    return dn
      ?`<div class="p-tr ${im?"im":"ni"}" style="grid-template-columns:${cols}"><div class="p-c0">${i+1}</div>${img}${desc}<div class="p-v p-ctr">${esc(it.unit||"Pcs")}</div><div class="p-v p-ctr">${fmt(it.qty)}</div><div class="p-v b p-ctr">${fmt(it.qtyDel)}</div></div>`
      :`<div class="p-tr ${im?"im":"ni"}" style="grid-template-columns:${cols}"><div class="p-c0">${i+1}</div>${img}${desc}<div class="p-v p-ctr">${fmt(it.qty)}</div><div class="p-v u p-ctr">${esc(it.unit||"Pcs")}</div><div class="p-v p-rt">${isSlashed(d,it)?`<span class="p-was">${fmt(it.list)}</span><span class="p-now">${fmt(it.rate)}</span>`:fmt(it.rate)}</div><div class="p-v b p-am">${fmt(lineAmt(it))}</div></div>`;
  }).join(""):`<div class="p-tr ni"><div class="p-none">No items yet</div></div>`;
  const taxLbl=d.taxMode==="add"?`Sales Tax (${num(d.gstRate)}%)`:"Sales Tax";
  const taxVal=d.taxMode==="add"?fmt(t.tax):"Excl.";
  const bank=[s.bankTitle&&("Account Title: "+s.bankTitle),s.bankName&&("Bank: "+s.bankName),s.bankAcc&&("Account No: "+s.bankAcc),s.iban&&("IBAN: "+s.iban)].filter(Boolean).join("\n");
  const blank="______________________",dp=d.dispatch||{};
  let body;
  if(dn){
    const units=[...new Set(d.items.map(i=>i.unit||"Pcs"))];
    body=`<div class="p-dns"><div class="p-lbl">SUMMARY</div><div class="p-nt">Total items: ${d.items.length}   ·   Total quantity: ${fmt(t.qty)}${units.length===1?" "+esc(units[0]):""}   ·   No. of packages: ${esc(dp.packages||"______")}   ·   CCT / Finish: ${esc(dp.cct||"______")}</div><div class="p-hr"></div></div>
    <div class="p-tb"><div class="l"><div class="p-lbl">RECEIVING INSTRUCTIONS</div><div class="p-tx">${esc(numbered(d.instructions))}</div></div>
    <div class="r"><div class="p-lbl">DISPATCH DETAILS</div><div class="p-tx">Vehicle No: ${esc(dp.vehicle||blank)}\nDriver Name: ${esc(dp.driver||blank)}\nDriver Contact: ${esc(dp.contact||blank)}\nDispatch Time: ${esc(dp.time||blank)}</div></div></div>
    <div class="p-sg2"><div><div class="ln"></div><div class="n">Delivered By – ${esc(s.company)}</div><div class="t">Name, Signature &amp; Date</div></div><div><div class="ln"></div><div class="n">Received By – Customer</div><div class="t">Name, Signature, Date &amp; Stamp</div></div></div>`;
  }else{
    body=`<div class="p-sum"><div class="lf"><div class="p-lbl">AMOUNT IN WORDS</div><div class="p-wd">${esc(inWords(t.grand))}</div>${d.notes?`<div class="p-lbl p-gap">NOTES</div><div class="p-nt">${esc(d.notes)}</div>`:""}</div>
      <div class="rt"><div class="p-tot"><div class="k">Subtotal</div><div class="v">${fmt(t.sub)}</div><div class="k">Discount</div><div class="v">${fmt(t.disc)}</div><div class="k">${taxLbl}</div><div class="v">${taxVal}</div></div>
      <div class="p-gt"><div class="k">GRAND TOTAL</div><div class="v">PKR ${fmt(t.grand)}</div></div>${t.save>0?`<div class="p-save">You save PKR ${fmt(t.save)}</div>`:""}</div></div>
    <div class="p-hr"></div>
    <div class="p-tb"><div class="l"><div class="p-lbl">TERMS &amp; CONDITIONS</div><div class="p-tx">${esc(numbered(docTerms(d,d.terms)))}</div></div>
    <div class="r">${d.type==="PO"?`<div class="p-lbl">DELIVER TO</div><div class="p-tx">${esc(poDeliverTo())}</div>`:bank?`<div class="p-lbl">BANK DETAILS</div><div class="p-tx">${esc(bank)}</div>`:""}</div></div>
    <div class="p-sig"><div class="ln"></div><div class="n">${esc(s.signName||" ")}</div><div class="t">${esc(s.signTitle||"Authorised Signatory")}</div></div>`;
  }
  const word={QT:"quotation",INV:"invoice",DN:"delivery note",PO:"purchase order"}[d.type];
  const foot=`This is a computer-generated ${word}.  For queries: ${[s.phone,s.email].filter(Boolean).join("  ·  ")}${dn?"":d.type==="PO"?"  ·  Thank you.":"  ·  Thank you for your business."}`;
  return `<div class="paper"><div class="bt"></div>
  <div class="p-hdr"><img class="logo" src="${esc(s.logo||LOGO)}" alt="">
    <div class="co"><div class="n">${esc((s.company||"").toUpperCase())}</div>${s.tagline?`<div class="t">${esc(s.tagline)}</div>`:""}<div class="a">${esc(addr)}</div></div>
    <div class="ti"><div class="h">${title}</div><div class="s">${sub}</div></div></div>
  <div class="p-rule"></div>
  <div class="p-info"><div class="p-box l"><div class="p-lbl">${partyLabel(d)}</div><div class="p-cn">${esc(c.name||"—")}</div>${cdet?`<div class="p-cd">${esc(cdet)}</div>`:""}</div>
    <div class="p-box r"><div class="p-meta">${meta.map(([k,v])=>`<div class="k">${k}</div><div class="v">${esc(v)}</div>`).join("")}</div></div></div>

/* ---------- images ---------- */
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src})}
/* keep the original file when it is already a PNG/JPEG of sensible size; otherwise downscale once, PNG stays PNG */
async function prepUpload(file,maxDim,maxBytes){
  const url=URL.createObjectURL(file);
  try{const img=await loadImg(url);const w=img.naturalWidth,h=img.naturalHeight;
    if(/^image\/(png|jpeg)$/.test(file.type)&&file.size<=maxBytes&&Math.max(w,h)<=maxDim)return{blob:file,w,h};
    const sc=Math.min(1,maxDim/Math.max(w,h));const c=document.createElement("canvas");c.width=Math.round(w*sc);c.height=Math.round(h*sc);
    const x=c.getContext("2d");const jpg=file.type==="image/jpeg";if(jpg){x.fillStyle="#ffffff";x.fillRect(0,0,c.width,c.height)}
    x.imageSmoothingQuality="high";x.drawImage(img,0,0,c.width,c.height);
    const blob=await new Promise(r=>c.toBlob(r,jpg?"image/jpeg":"image/png",.95));return{blob,w:c.width,h:c.height};
  }finally{URL.revokeObjectURL(url)}
}
async function storeImage(blob){
  if(ASSETS){const r=await ASSETS.upload(blob);return r.url}
  return await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(blob)});
}

  const g=new Map();
  for(const d of S.docs){const k=keyOf(d);if(!g.has(k))g.set(k,[]);g.get(k).push(d)}
  const by=(a,b)=>(a.createdAt||0)-(b.createdAt||0);
  return[...g.entries()].map(([key,docs])=>{
    const qt=docs.filter(d=>d.type==="QT").sort(by).at(-1),inv=docs.filter(d=>d.type==="INV").sort(by).at(-1),dns=docs.filter(d=>d.type==="DN").sort(by),pos=docs.filter(d=>d.type==="PO").sort(by);
    if(!qt&&!inv&&!dns.length)return null;
    const base=inv||qt||dns[0],rem=(inv||qt)?remaining(inv||qt,dns):[];
    const status=dns.length?(rem.some(r=>r>0)?"part":"delivered"):inv?"invoiced":"quoted";
    const updated=Math.max(...docs.map(d=>d.updatedAt||d.createdAt||0));
    return{key,docs,qt,inv,dns,pos,base,status,updated,customer:base.customer||{},value:(inv||qt)?(inv||qt).totals?.grand??calc(inv||qt).grand:null};

const itemKey=it=>it.pid?`${it.pid}|${it.vid||""}|${JSON.stringify(Object.entries(it.opts||{}).filter(([,x])=>x).sort())}`:String(it.name||"").trim().toLowerCase();

  const sent=new Map();for(const dn of dns)for(const it of dn.items||[]){const k=itemKey(it);sent.set(k,(sent.get(k)||0)+num(it.qtyDel))}
  return(src.items||[]).map(it=>{const k=itemKey(it),have=sent.get(k)||0,need=num(it.qty),use=Math.min(have,need);sent.set(k,have-use);return need-use});

async function convert(src,to){

  if(to==="DN"){

    d.items=d.items.map((it,i)=>({...it,qtyDel:rem[i]??num(it.qty)})).filter((it,i)=>(rem[i]??1)>0);

const supOf=p=>p&&(p.supplierId&&S.suppliers.find(x=>x.id===p.supplierId)||S.suppliers.find(x=>p.supplier&&x.name.toLowerCase()===String(p.supplier).toLowerCase()||(x.aliases||[]).some(a=>p.supplier&&a.toLowerCase()===String(p.supplier).toLowerCase())))||null;
const supParty=x=>x?{id:x.id,name:x.name||"",attn:x.attn||"",phone:x.phone||"",email:x.email||"",address:x.address||"",ntn:x.ntn||""}:{id:"",name:"Supplier (to choose)",attn:"",phone:"",email:"",address:"",ntn:""};
async function makePOs(src){
  const j=jobFor(src),from=j?.inv||src;
  let jobId=from.jobId;
  if(!jobId){jobId=uid("j");for(const x of(j?.docs||[from]))if(x.id){x.jobId=jobId;try{await put("docs",x.id,strip(clone(x)))}catch{}}}

  const onPO=new Map();for(const po of j?.pos||[])for(const it of po.items||[]){const k=itemKey(it);onPO.set(k,(onPO.get(k)||0)+num(it.qty))}
  const groups=new Map();
  for(const it of from.items||[]){const k=itemKey(it),have=onPO.get(k)||0,q=num(it.qty)-have;onPO.set(k,Math.max(0,have-num(it.qty)));if(q<=0)continue;

    if(!groups.has(gk))groups.set(gk,{sup,items:[]});const c=lineCost(it);
    groups.get(gk).items.push({pid:it.pid||"",vid:it.vid||"",opts:clone(it.opts||{}),name:it.name,spec:it.spec||"",warranty:it.warranty||"",img:it.img||"",unit:it.unit||"Pcs",qty:q,qtyDel:q,rate:c,list:c,cost:c})}
  if(!groups.size){const first=j?.pos?.[0];if(first){openDocById(first.id);toast("Everything on this invoice is already on a purchase order")}else toast("No items to order");return}
  const drafts=[...groups.values()].map(g=>{const d=blankDoc("PO");d.jobId=jobId;d.refINV=from.type==="INV"?from.number:"";d.customer=supParty(g.sup);d.items=g.items;d.showImages=from.showImages;d.taxMode="excl";return d});
  if(drafts.length===1){openEditor(drafts[0],true);toast(`Purchase order drafted at cost prices${drafts[0].customer.id?" for "+drafts[0].customer.name:""}`);return}
  /* one PO per supplier: all saved as drafts, first one opened */
  let firstId=null;
  for(const d of drafts){d.number=await nextNumber("PO",d.date);d.totals=calc(d);d.createdAt=d.updatedAt=Date.now();const id=uid("d");firstId=firstId||id;await put("docs",id,strip(clone(d)))}
  toast(`${drafts.length} purchase orders drafted, one per supplier`);setTimeout(()=>openDocById(firstId),300);
}
/* what negotiation saved, and what this PO leaves as profit against the invoice */
function poNumbers(d){
  const t=calc(d),net=t.sub-t.disc,quoted=d.items.reduce((a,it)=>a+num(num(it.list)>0?it.list:it.rate)*num(it.qty),0),saved=Math.max(0,Math.round(quoted-net));
  const inv=d.refINV&&S.docs.find(x=>x.type==="INV"&&x.number===d.refINV);let sale=null;
  if(inv){const pool=new Map();for(const it of inv.items||[]){const k=itemKey(it);if(!pool.has(k))pool.set(k,num(it.rate))}
    const it0=calc(inv),f=it0.sub?(it0.sub-it0.disc)/it0.sub:1;
    sale=Math.round(d.items.reduce((a,it)=>a+(pool.has(itemKey(it))?pool.get(itemKey(it)):0)*num(it.qty),0)*f)}
  return{net,quoted:Math.round(quoted),saved,sale,profit:sale==null?null:sale-net,pct:sale?Math.round((sale-net)/sale*1000)/10:0,inv}}

function lineConflicts(it,lc){const p=S.products.find(x=>x.id===it.pid);if(!hasVar(p)&&!(p?.options||[]).length)return false;
  const r=readVariant(p,lc);if(r.v&&it.vid&&r.v.id!==it.vid)return true;

  if(/\b(show|with|add)\b.*\b(photos?|images?|pictures?|pics?)\b/.test(lc)){d.showImages=true;return"Product photos shown"}

  /* text fields: take everything after the keyword */
  const after=re=>{const r=c.match(re);return r?r[r.length-1].trim():null};

  if(!dn&&(v=after(/^(?:remove|delete|drop)\s+(?:the\s+)?(?:term|condition|t&c)\s*(?:about|with|on|for)?\s*[:\-]?\s*(.+)$/i))){
    const L=lines(d.terms);const k=+v;const idx=Number.isInteger(k)&&k>0?k-1:L.findIndex(l=>l.toLowerCase().includes(v.toLowerCase()));
    if(idx<0||idx>=L.length)return{ask:`No term matching “${v}”.`};const gone=L.splice(idx,1)[0];d.terms=L.join("\n");return`Term removed: “${gone.replace(/^\d+[.)]\s*/,"")}”`}

async function makePDF(d){
  if(!DL){toast("Downloads aren't available in this view.");return}
  toast("Building PDF…");
  let bytes;
  try{bytes=await buildPDF(d)}catch(e){toast(libsP?"Couldn't create the PDF.":"PDF tool couldn't load. Check your connection and try again.");return}
  try{
    const name=`${d.number||"Draft-"+d.type} - ${(d.customer?.name||"Customer").replace(/[\\/:*?"<>|]/g,"")}.pdf`;
    const r=await DL.save({filename:name,data:new Blob([bytes],{type:"application/pdf"})});
    if(r?.status==="saved")toast("PDF saved");
  }catch(e){if(e?.code!=="declined")toast("Couldn't save the PDF.")}
}

async function uploadLogo(file){
  if(!/^image\/(png|jpeg)$/.test(file.type)){toast("Use a PNG or JPG logo");return}
  const info=$("#logoInfo");if(info)info.textContent="Uploading…";
  try{const r=await prepUpload(file,3000,6e6);const url=await storeImage(r.blob);const o={...S.settings,logo:url,logoW:r.w,logoH:r.h};await saveSettings(o);S.settings=o;vSettings();toast("Logo updated")}
  catch{if(info)info.textContent="Upload failed. Try another PNG or JPG.";}
}
function logoQuality(){
  const img=$("#logoImg"),info=$("#logoInfo");if(!img||!info)return;
  const show=()=>{const w=img.naturalWidth,h=img.naturalHeight;if(!w){info.textContent="";return}
    const sc=Math.min(150/w,67.5/h),inches=w*sc*0.75/72,dpi=Math.round(w/inches);
    const q=dpi>=300?["good","Print sharp"]:dpi>=200?["ok","Good"]:["low","Low: may print soft"];
    info.innerHTML=`<span>${w} × ${h} px</span><span>prints at ${dpi} dpi</span><span class="q ${q[0]}">${q[1]}</span>`};
  img.complete?show():img.addEventListener("load",show,{once:true});
}
["dragover","dragenter"].forEach(ev=>document.addEventListener(ev,e=>{const z=e.target.closest?.("#logoDrop");if(z){e.preventDefault();z.classList.add("over")}}));
["dragleave","drop"].forEach(ev=>document.addEventListener(ev,e=>{const z=e.target.closest?.("#logoDrop");if(z){e.preventDefault();z.classList.remove("over");if(ev==="drop"&&e.dataTransfer?.files?.[0])uploadLogo(e.dataTransfer.files[0])}}));
/* ---------- events ---------- */
document.addEventListener("click",async e=>{
  const nb=e.target.closest("[data-nav]");if(nb){const v=nb.dataset.nav;S.pform=null;S.cform=null;go(v);return}
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,id=b.dataset.id;
  if(b.tagName==="SELECT")return;
  const findDoc=()=>S.docs.find(d=>d.id===id);
  if(a!=="deldoc"&&a!=="delprod"&&a!=="delcust")S.armed=null;
  switch(a){
    case"newdoc":openEditor(blankDoc(b.dataset.t),true);break;
    case"filter":S.filter=b.dataset.f;vDocs();break;
    case"mode":S.mode=b.dataset.m;vDocs();break;
    case"jfilter":S.jfilter=b.dataset.f;vDocs();break;
    case"open":openDocById(id);break;
    case"pdf":{const d=findDoc();if(d)makePDF(d);break}
    case"convert":{const d=findDoc();if(d)convert(d,b.dataset.to);break}
    case"deldoc":if(S.armed===id){S.armed=null;await del("docs",id);toast("Deleted")}else{S.armed=id;refreshList()}break;
    case"back":go("docs");break;
    case"pane":S.pane=b.dataset.p;document.querySelector(".editor").dataset.pane=S.pane;document.querySelectorAll('[data-act="pane"]').forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.p===S.pane)));if(S.pane==="preview")updatePreview();break;
    case"ai":runAI();break;
    case"undo":if(S.ed?.undo){S.ed.doc=S.ed.undo;S.ed.undo=null;S.ed.dirty=true;S.ed.cmdLog={done:["Last change undone"],asks:[],help:false};vEditor()}break;
    case"cmdhelp":S.ed.cmdLog={done:[],asks:[],help:true};$("#aiMsg").innerHTML=cmdLogHTML();break;
    case"additem":S.ed.dirty=true;S.ed.doc.items.push({pid:"",name:"",spec:"",warranty:"",img:"",unit:"Pcs",qty:1,qtyDel:1,rate:0});$("#items").innerHTML=itemsHTML(S.ed.doc);updatePreview();break;
    case"rmitem":S.ed.dirty=true;S.ed.doc.items.splice(+b.dataset.i,1);$("#items").innerHTML=itemsHTML(S.ed.doc);updatePreview();break;
    case"save":saveDoc();break;
    case"edpdf":if(!S.ed.id||S.ed.dirty){if(!(await saveDoc()))break}makePDF(S.ed.doc);break;
    case"edconvert":if(S.ed.dirty&&!(await saveDoc()))break;convert(S.ed.doc,b.dataset.to);break;
    case"savecust":if(S.ed.doc.type==="PO"){const c=S.ed.doc.customer;if(!c.name.trim()||/to choose/i.test(c.name)){toast("Enter the supplier name first");break}
      const sid=c.id||uid("s");c.id=sid;await put("suppliers",sid,{...(S.suppliers.find(x=>x.id===sid)?strip(S.suppliers.find(x=>x.id===sid)):{}),name:c.name,attn:c.attn||"",phone:c.phone||"",email:c.email||"",address:c.address||"",ntn:c.ntn||""});$("#custPick").innerHTML=supOptions(sid);toast("Supplier saved");break}
    {const c=S.ed.doc.customer;if(!c.name.trim()){toast("Enter a customer name first");break}
      const cid=c.id||uid("c");c.id=cid;await put("customers",cid,{name:c.name,attn:c.attn||"",phone:c.phone||"",address:c.address||"",ntn:c.ntn||""});$("#custPick").innerHTML=custOptions(cid);toast("Customer saved");break}
    case"newprod":S.pform={id:"",name:"",category:S.pcat&&S.pcat!=="Uncategorised"?S.pcat:"",series:S.pser||"",spec:"",warranty:"",price:"",unit:"Pcs",model:"",keywords:"",img:"",variants:[],options:[]};S.armed=null;renderPForm();$("#pform").scrollIntoView({block:"nearest"});break;
    case"editprod":S.pform=clone(S.products.find(p=>p.id===id));S.pform.variants=S.pform.variants||[];S.pform.options=(S.pform.options||[]).map(o=>({name:o.name||"",values:(o.values||[]).join(", "),only:(o.only||[]).join(", ")}));renderPForm();$("#pform").scrollIntoView({block:"nearest"});break;
    case"addvar":S.pform.variants.push({id:uid("v"),label:"",price:"",model:"",spec:""});renderPForm();document.querySelector(`[data-vf="${S.pform.variants.length-1}.label"]`)?.focus();break;
    case"rmvar":S.pform.variants.splice(+b.dataset.i,1);renderPForm();break;
    case"addopt":S.pform.options.push({name:"",values:"",only:""});renderPForm();document.querySelector(`[data-of="${S.pform.options.length-1}.name"]`)?.focus();break;
    case"rmopt":S.pform.options.splice(+b.dataset.i,1);renderPForm();break;
    case"pcat":S.pcat=b.dataset.c||"";S.pser="";S.pq="";if($("#pq"))$("#pq").value="";renderPBody();$("#plist").scrollIntoView({block:"start",behavior:"smooth"});break;
    case"pser":S.pser=b.dataset.c||"";renderPBody();$("#plist").scrollIntoView({block:"start",behavior:"smooth"});break;
    case"costfill":{const p=S.pform;if(!p)break;const k=num($("#costPct").value);if(!(k>=0&&k<100)){toast("Enter a discount between 0 and 99%");break}
      p.supplierDisc=k;if(num(p.price))p.cost=Math.round(num(p.price)*(1-k/100));(p.variants||[]).forEach(v=>{const pr=num(v.price)||num(p.price);if(pr)v.cost=Math.round(pr*(1-k/100))});
      renderPForm();toast(`Costs filled at ${k}% below sale price`);break}
    case"cancelprod":S.pform=null;renderPForm();break;
    case"rmphoto":S.pform.img="";renderPForm();break;
    case"saveprod":{const p=S.pform;if(!p.name.trim()){toast("Give the product a name");break}const pid=p.id||uid("p");
      const list=x=>String(x||"").split(",").map(y=>y.trim()).filter(Boolean);
      const variants=(p.variants||[]).filter(v=>String(v.label||"").trim()).map(v=>({id:v.id||uid("v"),label:String(v.label).trim(),price:num(v.price),cost:num(v.cost),model:String(v.model||"").trim(),spec:String(v.spec||"").trim()}));
      const options=(p.options||[]).filter(o=>String(o.name||"").trim()&&list(o.values).length).map(o=>({name:String(o.name).trim(),values:list(o.values),only:list(o.only)}));
      await put("products",pid,{supplierId:p.supplierId||"",name:p.name.trim(),category:String(p.category||"").trim(),series:String(p.series||"").trim(),spec:p.spec||"",warranty:(p.warranty||"").trim(),price:num(p.price),cost:num(p.cost),supplier:p.supplier||"",supplierDisc:p.supplierDisc??"",unit:p.unit||"Pcs",model:p.model||"",keywords:p.keywords||"",img:p.img||"",variants,options});S.pform=null;renderPForm();toast("Product saved");break}
    case"delprod":if(S.armed===S.pform?.id){await del("products",S.pform.id);S.pform=null;S.armed=null;renderPForm();toast("Product deleted")}else{S.armed=S.pform.id;renderPForm()}break;
    case"pocosts":{if(S.armed!=="pocosts"){S.armed="pocosts";vEditorKeep();break}S.armed=null;const d=S.ed.doc;let n=0;const touched=new Map();
      for(const it of d.items){const p=it.pid&&(touched.get(it.pid)||clone(S.products.find(x=>x.id===it.pid)||null));if(!p||!num(it.rate))continue;
        const v=it.vid&&(p.variants||[]).find(x=>x.id===it.vid);if(v)v.cost=num(it.rate);else p.cost=num(it.rate);touched.set(p.id,p);n++}
      for(const p of touched.values())await put("products",p.id,strip(p));toast(n?`Updated cost on ${touched.size} product${touched.size===1?"":"s"}`:"No catalogue items on this PO");vEditorKeep();break}
    case"cmode":S.cmode=b.dataset.m;S.cform=null;S.sform=null;S.armed=null;vCustomers();break;
    case"newsup":S.sform={id:"",name:"",attn:"",phone:"",email:"",address:"",ntn:""};S.armed=null;renderCForm();break;
    case"editsup":S.sform=clone(S.suppliers.find(c=>c.id===id));renderCForm();break;
    case"cancelsup":S.sform=null;renderCForm();break;
    case"supnew":{const c=S.suppliers.find(x=>x.id===id);const d=blankDoc("PO");d.customer=supParty(c);openEditor(d,true);break}
    case"savesupf":{const c=S.sform;if(!c.name.trim()){toast("Enter a name");break}await put("suppliers",c.id||uid("s"),{...strip(c),name:c.name.trim()});S.sform=null;renderCForm();toast("Supplier saved");break}
    case"delsup":if(S.armed===S.sform?.id){await del("suppliers",S.sform.id);S.sform=null;S.armed=null;renderCForm();toast("Supplier deleted")}else{S.armed=S.sform.id;renderCForm()}break;
    case"newcust":S.cform={id:"",name:"",attn:"",phone:"",address:"",ntn:""};S.armed=null;renderCForm();break;
    case"editcust":S.cform=clone(S.customers.find(c=>c.id===id));renderCForm();break;
    case"cancelcust":S.cform=null;renderCForm();break;
    case"custnew":{const c=S.customers.find(x=>x.id===id);const d=blankDoc("INV");d.customer={id:c.id,name:c.name,attn:c.attn||"",phone:c.phone||"",address:c.address||"",ntn:c.ntn||""};openEditor(d,true);break}
    case"savecustf":{const c=S.cform;if(!c.name.trim()){toast("Enter a name");break}await put("customers",c.id||uid("c"),{name:c.name.trim(),attn:c.attn||"",phone:c.phone||"",address:c.address||"",ntn:c.ntn||""});S.cform=null;renderCForm();toast("Customer saved");break}
    case"delcust":if(S.armed===S.cform?.id){await del("customers",S.cform.id);S.cform=null;S.armed=null;renderCForm();toast("Customer deleted")}else{S.armed=S.cform.id;renderCForm()}break;
    case"savesettings":{const o={...S.settings};document.querySelectorAll("[data-sf]").forEach(i=>o[i.dataset.sf]=i.value);o.gstRate=num(o.gstRate);o.quoteValidDays=num(o.quoteValidDays)||7;delete o.id;
      try{await saveSettings(o);S.settings={...DEFAULTS,...o};S.sDirty=false;toast("Settings saved")}catch{toast("Couldn't save settings")}break}
    case"resetlogo":{const o={...S.settings,logo:""};await saveSettings(o);S.settings=o;vSettings();break}
    case"savecounters":{const y=todayISO().slice(0,4);for(const t of["QT","INV","DN","PO"]){const v=parseInt($("#cnt-"+t).value,10);if(Number.isFinite(v)&&v>=0)await counterSet(`${t}-${y}`,v)}toast("Numbering updated");break}
  }
});
document.addEventListener("keydown",e=>{if(e.target.id==="aiText"&&e.key==="Enter"&&(e.metaKey||e.ctrlKey)){e.preventDefault();runAI()}});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="dq"){S.q=t.value;refreshList();return}
  if(t.id==="aiText"&&S.ed){S.ed.aiText=t.value;return}
  if(t.id==="pq"){S.pq=t.value;renderPBody();return}
  if(t.dataset.pf&&S.pform){S.pform[t.dataset.pf]=t.value;const pm=$("#pmargin");if(pm)pm.textContent=formMargin(S.pform);return}
  if(t.dataset.vf&&S.pform){const[i,k]=t.dataset.vf.split(".");S.pform.variants[+i][k]=t.value;const pm=$("#pmargin");if(pm)pm.textContent=formMargin(S.pform);return}
  if(t.dataset.of&&S.pform){const[i,k]=t.dataset.of.split(".");S.pform.options[+i][k]=t.value;return}
  if(t.dataset.cf&&S.cform){S.cform[t.dataset.cf]=t.value;return}
  if(t.dataset.sf2&&S.sform){S.sform[t.dataset.sf2]=t.value;return}
  if(t.dataset.sf){S.sDirty=true;return}
  if(t.dataset.f&&S.ed){S.ed.dirty=true;const f=t.dataset.f;setPath(S.ed.doc,f,t.type==="checkbox"?t.checked:t.value);
    if(f.startsWith("customer.")&&f!=="customer.id"){/* keep link to saved customer */}
    const m=f.match(/^items\.(\d+)\.(qty|rate)$/);if(m){const el=document.querySelector(`[data-amt="${m[1]}"]`);if(el)el.textContent="PKR "+fmt(lineAmt(S.ed.doc.items[+m[1]]))}
    if(f==="date"&&S.ed.doc.type==="QT"&&!S.ed.id)S.ed.doc.validUntil=addDays(t.value,num(S.settings.quoteValidDays)||7),document.querySelector('[data-f="validUntil"]').value=S.ed.doc.validUntil;
    updatePreview()}
});
document.addEventListener("change",async e=>{
  const t=e.target;
  if(t.id==="custPick"&&S.ed&&S.ed.doc.type==="PO"){S.ed.dirty=true;const c=S.suppliers.find(x=>x.id===t.value);if(c){S.ed.doc.customer=supParty(c);vEditorKeep()}return}
  if(t.id==="custPick"&&S.ed){S.ed.dirty=true;const c=S.customers.find(x=>x.id===t.value);if(c){S.ed.doc.customer={id:c.id,name:c.name||"",attn:c.attn||"",phone:c.phone||"",address:c.address||"",ntn:c.ntn||""};vEditorKeep()}return}
  if((t.dataset.act==="vsel"||t.dataset.act==="osel")&&S.ed){S.ed.dirty=true;const i=+t.dataset.i,it=S.ed.doc.items[i],p=S.products.find(x=>x.id===it.pid);if(!p)return;
    if(t.dataset.act==="vsel")setLineVariant(it,p,t.value,null);else setLineVariant(it,p,it.vid,{[t.dataset.o]:t.value});
    S.ed.lastItem=i;$("#items").innerHTML=itemsHTML(S.ed.doc);updatePreview();return}
  if(t.dataset.act==="pick"&&S.ed){S.ed.dirty=true;S.ed.doc.items[+t.dataset.i].cost=null;const i=+t.dataset.i,p=S.products.find(x=>x.id===t.value),it=S.ed.doc.items[i];
    S.ed.lastItem=i;if(p)S.ed.doc.items[i]=itemFromProduct(p,num(it.qty)||1,num(p.price));else it.pid="";$("#items").innerHTML=itemsHTML(S.ed.doc);updatePreview();return}
  if(t.type==="checkbox"&&t.dataset.f){S.ed.dirty=true;setPath(S.ed.doc,t.dataset.f,t.checked);if(t.dataset.f==="slash")$("#items").innerHTML=itemsHTML(S.ed.doc);updatePreview();return}
  if(t.tagName==="SELECT"&&t.dataset.f&&S.ed){S.ed.dirty=true;setPath(S.ed.doc,t.dataset.f,t.value);updatePreview();return}
  if(t.id==="pPhoto"&&t.files[0]&&S.pform){const m=$("#pPhotoMsg");m.textContent="Uploading…";
    try{const r=await prepUpload(t.files[0],1600,4e6);S.pform.img=await storeImage(r.blob);renderPForm()}catch{m.textContent="Upload failed. Try a JPG or PNG."}return}
  if(t.id==="logoFile"&&t.files[0]){uploadLogo(t.files[0]);return}
  if(t.id==="showCosts"){const o={...S.settings,showCosts:t.checked};delete o.id;await saveSettings(o);S.settings={...DEFAULTS,...o};toast(t.checked?"Costs shown":"Costs hidden");return}
  if(t.id==="importProducts"&&t.files[0]){const msg=$("#importMsg");msg.textContent="Importing…";
    try{const j=JSON.parse(await t.files[0].text());const list=Array.isArray(j)?j:Array.isArray(j.products)?j.products:[];if(!list.length)throw new Error("No products found in that file.");
      let n=0;for(const p of list){if(!p||!p.name)continue;const rec={...p};const id=String(rec.id||uid("p"));delete rec.id;
        if(typeof rec.img==="string"&&rec.img.startsWith("data:")){try{rec.img=await storeImage(await (await fetch(rec.img)).blob())}catch{rec.img=""}}
        const old=S.products.find(x=>x.id===id);if(old?.img&&!rec.img)rec.img=old.img;
        await put("products",id,{category:"",series:"",spec:"",warranty:"",price:0,unit:"Pcs",model:"",keywords:"",img:"",variants:[],options:[],...rec});n++}
      msg.textContent=`Imported ${n} product${n===1?"":"s"}.`;toast(`Imported ${n} product${n===1?"":"s"}`)}
    catch(e){msg.textContent=e.message&&!/JSON/.test(e.message)?e.message:"That file isn't a product file."}t.value="";return}
});

    {id:"p_convex",name:"Cylindrical Downlight – Convex Series",spec:"15W  ·  Black  ·  Model RL-CV15-BK",price:2599,unit:"Pcs",model:"RL-CV15-BK",keywords:"convex",img:""}];
  S.customers=[{id:"c_mcs",name:"Mall Of Central Square",attn:"Mr. Mashood",phone:"",address:"Mall of Central Square, Multan",ntn:""}];
  S.docs=[];Object.keys(S.ready).forEach(k=>S.ready[k]=true);
}
(async()=>{
  const use=n=>window.claude?.use?window.claude.use(n).catch(()=>null):Promise.resolve(null);
  render();
  [DB,ASSETS,SAMPLE,DL]=await Promise.all([use("db"),use("assets"),use("sample"),use("downloads")]);
  if(!DB){demo();const bn=$("#banner");bn.hidden=false;bn.textContent="Example data shown. Saving is unavailable in this view; open the artifact while signed in to keep your records.";render();return}
  DB.doc("settings/main").onSnapshot(s=>{S.settings={...DEFAULTS,...(s.data()||{})};S.ready.settings=true;afterData("settings")});
  for(const col of["products","customers","suppliers"])DB.collection(col).onSnapshot(q=>{S[col]=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(a.name).localeCompare(String(b.name)));S.ready[col]=true;afterData(col)},()=>{S.ready[col]=true;afterData(col)});
  DB.collection("docs").orderBy("createdAt","desc").limit(1000).onSnapshot(q=>{S.docs=q.docs.map(d=>({id:d.id,...d.data()}));S.ready.docs=true;afterData("docs")},()=>{S.ready.docs=true;afterData("docs")});
})();
</script>
