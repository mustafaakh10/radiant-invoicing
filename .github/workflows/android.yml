name: Build Android APK

on:
  # Manual only for now: Actions tab → Build Android APK → Run workflow
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ubuntu-latest already ships the Android SDK (ANDROID_HOME is set)
      - name: Check Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms"

      - name: Install
        run: npm ci

      - name: Build app files
        run: python3 tools/build_www.py

      - name: Copy into Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "RadiantBilling-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: RadiantBilling-1.0.${{ github.run_number }}
          path: RadiantBilling-*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Radiant Billing 1.0.${{ github.run_number }}
          body: |
            Install: download the .apk below on your Android phone and open it (allow "Install unknown apps" once).
            Updates install over the previous version and keep your data.
          files: RadiantBilling-*.apk
          make_latest: true
