{% load static %}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2b3a2f">
<title>Sign in · Radiant Billing</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="{% static 'app/fonts/fonts.css' %}">
<style>
:root{--deep:#2b3a2f;--g:#6d9f53;--ink:#1f2933;--muted:#6b7280;--line:#e3e7e1;--bg:#f4f6f2}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);font-family:Figtree,system-ui,sans-serif;color:var(--ink);padding:16px}
.card{width:100%;max-width:380px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px 24px;box-shadow:0 10px 30px rgba(43,58,47,.08)}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.brand img{height:44px}
.brand b{display:block;font-size:17px}.brand small{color:var(--muted);font-size:13px}
label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
input{width:100%;font:inherit;font-size:15px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
input:focus{outline:2px solid color-mix(in srgb,var(--g) 45%,transparent);border-color:var(--g)}
button{width:100%;margin-top:20px;font:inherit;font-weight:700;font-size:15px;padding:12px;border:0;border-radius:10px;background:var(--deep);color:#fff;cursor:pointer}
button:hover{background:#22302a}
.err{background:#fdecec;color:#9b2c2c;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:6px}
</style>
</head>
<body>
<form class="card" method="post">{% csrf_token %}
  <div class="brand"><img src="{% static 'app/img/logo.jpg' %}" alt=""><div><b>Radiant Billing</b><small>Quotations · Invoices · Orders</small></div></div>
  {% if form.errors %}<div class="err">That username and password didn't match.</div>{% endif %}
  <label for="id_username">Username</label><input id="id_username" name="username" autocomplete="username" autofocus required>
  <label for="id_password">Password</label><input id="id_password" type="password" name="password" autocomplete="current-password" required>
  <input type="hidden" name="next" value="{{ next }}">
  <button type="submit">Sign in</button>
</form>
</body>
</html>
